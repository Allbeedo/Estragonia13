name: Apple test

# Runs samples/HelloWorld on a GitHub macOS runner and uploads screenshots.
# macos-latest is an Apple silicon VM with a paravirtualized Metal device and a logged-in GUI session,
# so Godot gets a real window and the Metal backend runs on real Metal.

on:
  workflow_dispatch:
    inputs:
      print_screenshots:
        description: Also print the screenshots (base64, downscaled) into the job log, for tools that can't download artifacts
        type: boolean
        default: false
  push:
    branches: [feature/apple-platform]
    paths:
      - 'src/**'
      - 'samples/**'
      - '.github/ci/**'
      - '.github/workflows/apple-test.yml'

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2-stable
      SAMPLE: samples/HelloWorld
      SHOT_DIR: ${{ github.workspace }}/screenshots
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download Godot .NET
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_macos.universal.zip"
          unzip -q godot.zip -d godot
          echo "GODOT=$PWD/godot/Godot_mono.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Build sample
        run: dotnet build "$SAMPLE/HelloWorld.csproj" --nologo

      - name: Add screenshot autoload
        run: |
          cp .github/ci/screenshot.gd "$SAMPLE/CiScreenshot.gd"
          perl -pi -e 's|^(AvaloniaLoader=.*)$|$1\nCiScreenshot="*res://CiScreenshot.gd"|' "$SAMPLE/project.godot"
          grep -A3 '^\[autoload\]' "$SAMPLE/project.godot"

      - name: Import project
        run: perl -e 'alarm shift; exec @ARGV' 300 "$GODOT" --headless --path "$SAMPLE" --import

      - name: Run sample
        run: |
          mkdir -p "$SHOT_DIR"
          status=0
          echo "| Run | Godot driver | Estragonia path | Screenshots |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------------|-----------------|-------------|" >> "$GITHUB_STEP_SUMMARY"

          run() {
            local name=$1; shift
            echo "::group::$name"
            SHOT_NAME=$name perl -e 'alarm shift; exec @ARGV' 120 \
              "$GODOT" --path "$SAMPLE" --resolution 1152x648 "$@" > "$SHOT_DIR/$name.log" 2>&1 || true
            cat "$SHOT_DIR/$name.log"
            echo "::endgroup::"

            local driver path shots
            driver=$(sed -n 's/^CI: driver=\([^ ]*\).*/\1/p' "$SHOT_DIR/$name.log")
            if grep -q "Estragonia is rendering on the CPU" "$SHOT_DIR/$name.log"; then path=CPU; else path=GPU; fi
            grep -q "couldn't initialize GPU" "$SHOT_DIR/$name.log" && path="CPU (GPU init failed)"
            [ -z "$driver" ] && path="didn't start"
            shots=$(ls "$SHOT_DIR" | grep -c "^$name-.*\.png$" || true)
            echo "| $name | ${driver:-?} | $path | $shots/3 |" >> "$GITHUB_STEP_SUMMARY"
            echo "$name: driver=${driver:-?} path=$path screenshots=$shots/3"

            if [ "$shots" != 3 ]; then status=1; fi
          }

          run metal --rendering-driver metal
          # Metal must use the GPU backend, not the CPU fallback.
          if ! grep -q "CI: driver=metal" "$SHOT_DIR/metal.log" || grep -q "Estragonia is rendering on the CPU" "$SHOT_DIR/metal.log"; then
            echo "::error::The metal run didn't use Estragonia's Metal backend"
            status=1
          fi

          # These two should use the CPU fallback.
          run opengl --rendering-method gl_compatibility --rendering-driver opengl3
          run moltenvk --rendering-driver vulkan

          exit $status

      - name: Print screenshots
        if: always() && inputs.print_screenshots
        run: |
          # JPEG keeps the log small; metal last, since log readers often only fetch the tail.
          for f in $(ls screenshots/*.png | sort -r); do
            sips -Z 1152 -s format jpeg -s formatOptions 80 "$f" --out small.jpg > /dev/null
            echo "BEGIN-SCREENSHOT $(basename "$f" .png).jpg"
            base64 -b 200 -i small.jpg
            echo "END-SCREENSHOT $(basename "$f" .png).jpg"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshots
          path: screenshots/
          if-no-files-found: warn
