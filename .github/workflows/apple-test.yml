name: Apple test

# Runs samples/HelloWorld on GitHub macOS runners and uploads screenshots.
# macos-latest is an Apple silicon VM with a paravirtualized Metal device and a logged-in GUI session,
# so Godot gets a real window and the Metal backend runs on real Metal.
# macos-15-intel is an Intel VM, likely without a usable GPU: it shows what old Intel Macs fall back to,
# so the "metal run must use the Metal backend" check only applies to Apple silicon.

on:
  workflow_dispatch:
    inputs:
      print_screenshots:
        description: Also print the screenshots (base64, downscaled) into the job log, for tools that can't download artifacts
        type: boolean
        default: false
  push:
    branches: [feature/apple-platform]
    paths:
      - 'src/**'
      - 'samples/**'
      - '.github/ci/**'
      - '.github/workflows/apple-test.yml'

permissions:
  contents: read

jobs:
  macos:
    name: macos (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: apple-silicon
            require_metal: true
          - runner: macos-15-intel
            arch: intel
            require_metal: false
    env:
      GODOT_VERSION: 4.7.2-stable
      SAMPLE: samples/HelloWorld
      SHOT_DIR: ${{ github.workspace }}/screenshots
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download Godot .NET
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_macos.universal.zip"
          unzip -q godot.zip -d godot
          echo "GODOT=$PWD/godot/Godot_mono.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Build sample
        run: dotnet build "$SAMPLE/HelloWorld.csproj" --nologo

      - name: Add screenshot autoload
        run: |
          cp .github/ci/screenshot.gd "$SAMPLE/CiScreenshot.gd"
          perl -pi -e 's|^(AvaloniaLoader=.*)$|$1\nCiScreenshot="*res://CiScreenshot.gd"|' "$SAMPLE/project.godot"
          grep -A3 '^\[autoload\]' "$SAMPLE/project.godot"

      - name: Import project
        run: perl -e 'alarm shift; exec @ARGV' 300 "$GODOT" --headless --path "$SAMPLE" --import

      - name: Run sample
        run: |
          mkdir -p "$SHOT_DIR"
          status=0
          echo "### ${{ matrix.arch }} ($(uname -m), macOS $(sw_vers -productVersion))" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | Godot driver (adapter) | Estragonia path | Screenshots | Exit code |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|------------------------|-----------------|-------------|-----------|" >> "$GITHUB_STEP_SUMMARY"

          run() {
            local name=$1; shift
            local required=$1; shift
            echo "::group::$name"
            touch "$RUNNER_TEMP/run-start"
            SHOT_NAME=$name perl -e 'alarm shift; exec @ARGV' 180 \
              "$GODOT" --path "$SAMPLE" --resolution 1152x648 "$@" > "$SHOT_DIR/$name.log" 2>&1 \
              && echo "exit code 0" >> "$SHOT_DIR/$name.log" || echo "exit code $?" >> "$SHOT_DIR/$name.log"
            cat "$SHOT_DIR/$name.log"
            # Godot crashes leave a macOS crash report; print the newest one from this run.
            local report
            report=$(find ~/Library/Logs/DiagnosticReports -name 'Godot*' -newer "$RUNNER_TEMP/run-start" 2>/dev/null | tail -1)
            if [ -n "$report" ]; then
              echo "--- crash report: $report"
              head -c 20000 "$report" | tee "$SHOT_DIR/$name.crash.txt"
            fi
            echo "::endgroup::"

            local driver adapter path shots exitcode
            exitcode=$(sed -n 's/^exit code //p' "$SHOT_DIR/$name.log")
            driver=$(sed -n 's/^CI: driver=\([^ ]*\).*/\1/p' "$SHOT_DIR/$name.log")
            adapter=$(sed -n 's/^CI: .* adapter=//p' "$SHOT_DIR/$name.log")
            path=$(sed -n 's/.*Estragonia is rendering on the GPU with //p' "$SHOT_DIR/$name.log" | head -1)
            grep -q "Estragonia is rendering on the CPU" "$SHOT_DIR/$name.log" && path=CPU
            [ -z "$path" ] && path="?"
            grep -q "couldn't initialize GPU" "$SHOT_DIR/$name.log" && path="CPU (GPU init failed)"
            [ -z "$driver" ] && path="didn't start"
            shots=$(ls "$SHOT_DIR" | grep -c "^$name-.*\.png$" || true)
            echo "| $name | ${driver:-?} (${adapter:-?}) | $path | $shots/3 | $exitcode |" >> "$GITHUB_STEP_SUMMARY"
            echo "$name: driver=${driver:-?} adapter=${adapter:-?} path=$path screenshots=$shots/3 exit=$exitcode"

            if [ "$required" = required ] && { [ "$shots" != 3 ] || [ "$exitcode" != 0 ]; }; then
              echo "::error::The $name run failed (screenshots $shots/3, exit code $exitcode)"
              status=1
            fi
          }

          # Apple silicon only: Godot has no Metal driver on Intel, and the Intel VMs have no GPU for Vulkan.
          if [ "${{ matrix.require_metal }}" = true ]; then gpu=required; else gpu=optional; fi

          # The project's own settings (driver.macos=metal), as a user would run it. On Intel, Godot has no
          # metal driver and uses Vulkan (MoltenVK), which aborts in Godot itself on the GPU-less Intel VMs.
          run default $gpu
          run metal $gpu --rendering-driver metal
          # Check Estragonia picked the expected GPU backend.
          expect() {
            local name=$1 backend=$2
            if ! grep -q "Estragonia is rendering on the GPU with $backend\$" "$SHOT_DIR/$name.log"; then
              if [ "${{ matrix.require_metal }}" = true ]; then
                echo "::error::The $name run didn't render on the GPU with $backend"
                status=1
              else
                echo "::warning::The $name run didn't render on the GPU with $backend on this runner"
              fi
            fi
          }

          # These two should use the CPU fallback.
          run opengl required --rendering-method gl_compatibility --rendering-driver opengl3
          run moltenvk $gpu --rendering-driver vulkan

          expect default Metal
          expect metal Metal
          # On Vulkan, Godot runs on MoltenVK: Estragonia draws with Metal into the Metal textures behind Godot's Vulkan images.
          expect moltenvk "Metal via MoltenVK"

          exit $status

      - name: Print screenshots
        if: always() && inputs.print_screenshots
        run: |
          # JPEG keeps the log small; metal last, since log readers often only fetch the tail.
          for f in $(ls screenshots/*.png | sort -r); do
            sips -Z 1152 -s format jpeg -s formatOptions 80 "$f" --out small.jpg > /dev/null
            echo "BEGIN-SCREENSHOT $(basename "$f" .png).jpg"
            base64 -b 200 -i small.jpg
            echo "END-SCREENSHOT $(basename "$f" .png).jpg"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.arch }}-screenshots
          path: screenshots/
          if-no-files-found: warn
